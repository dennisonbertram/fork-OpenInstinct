services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: open_instinct
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_instinct"]
      interval: 2s
      timeout: 5s
      retries: 10
      # First boot runs initdb, which takes longer than the retry budget on a
      # cold volume. Without this the container is declared unhealthy while it
      # is still initialising and `compose up --wait` fails.
      start_period: 60s

volumes:
  postgres-data:
