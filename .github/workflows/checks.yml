name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm verify --lane checks

      - name: Upload verification run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-verification-run
          path: .eve/verify/
          include-hidden-files: true
          if-no-files-found: error

  contract-evals:
    name: Contract evals
    needs: checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run model-free contract evals
        run: pnpm verify --lane contract-evals

      - name: Upload contract eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-eval-artifacts
          path: |
            .eve/verify/
            .eve/evals/
            .eve/contract*.xml
            evals/contract/mount-harness/.eve/evals/
            evals/contract/mount-harness/.eve/contract*.xml
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload contract verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-verification-receipt
          path: .eve/verify/**/receipt.json
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: E2E
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm verify --lane e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            .eve/verify/
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload E2E verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-verification-receipt
          path: .eve/verify/**/receipt.json
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:9/open_instinct
      KERNEL_API_KEY: ci-kernel-key
      BETTER_AUTH_SECRET: ci-auth-secret-synthetic-0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3000
      SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build with synthetic configuration
        run: pnpm verify --lane build

      - name: Upload verification run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-verification-run
          path: .eve/verify/
          include-hidden-files: true
          if-no-files-found: error

  real-postgres:
    name: Real Postgres
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required isolated Postgres tests and teardown
        run: pnpm verify --lane real-postgres
      - name: Upload real Postgres results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-postgres-results
          path: |
            .eve/verify/
            .eve/ci/real-postgres.xml
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload real Postgres verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-postgres-verification-receipt
          path: .eve/verify/**/receipt.json
          include-hidden-files: true
          if-no-files-found: error
