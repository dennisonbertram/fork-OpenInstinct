name: Square evals

# On demand only. Run it when a change could alter Square reply quality;
# see "Square evals" in AGENTS.md for the trigger list.
#   gh workflow run square-evals.yml -R dennisonbertram/fork-OpenInstinct --ref <branch>
on:
  workflow_dispatch:
    inputs:
      run:
        description: Paid eval target (one target per dispatch)
        required: true
        default: square
        type: choice
        options:
          - square
          - agent-smoke

concurrency:
  group: square-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  square-evals:
    name: Square evals
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the AI Gateway credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::AI_GATEWAY_API_KEY secret is not set; the evals cannot call the model."
            exit 1
          fi

      - name: Run square evals
        if: ${{ inputs.run == 'square' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        # No --strict: tone is judged but not gated (docs/SQUARE.md), and --strict
        # fails the run on a judge miss.
        run: pnpm eval:square --max-cost-usd 4 --estimated-cost-usd 4 --with-database --junit .eve/junit.xml

      - name: Run selected agent smoke
        if: ${{ inputs.run == 'agent-smoke' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: pnpm eval:agent --max-cost-usd 1 --estimated-cost-usd 1 --repetitions 1 --model openai/gpt-5.6-sol-fast --tag smoke --junit .eve/junit.xml

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-eval-${{ inputs.run }}
          path: |
            .eve/evals
            .eve/eval-runs
            .eve/square-evals
          include-hidden-files: true
          if-no-files-found: ignore
